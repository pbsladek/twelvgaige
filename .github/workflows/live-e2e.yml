name: Live E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live suite to run
        required: true
        default: k3d
        type: choice
        options:
          - k3d
          - providers
          - sqlcipher
          - keychain
          - all
      providers:
        description: Comma-separated providers for provider live tests, or blank to auto-detect configured providers
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'schedule' }}
  cancel-in-progress: false

env:
  MIX_ENV: test

jobs:
  k3d:
    name: live k3d
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || inputs.suite == 'k3d' || inputs.suite == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup BEAM
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Cache Mix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-live-k3d-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-live-k3d-mix-

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.32.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Install k3d
        env:
          K3D_VERSION: v5.8.3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

      - name: Live k3d E2E
        run: make e2e-k3d K3D_LIVE=1

      - name: Upload live k3d artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twelvgaige-live-k3d
          path: /tmp/twelvgaige-live-k3d-*
          if-no-files-found: warn
          retention-days: 14

  providers:
    name: live providers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-providers
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'providers' || inputs.suite == 'all')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup BEAM
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Cache Mix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-live-provider-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-live-provider-mix-

      - name: Live provider E2E
        env:
          PROVIDER_LIVE: "1"
          PROVIDER_LIVE_PROVIDERS: ${{ inputs.providers }}
          TWELVGAIGE_PROVIDER_LIVE_TIMEOUT_MS: "60000"
          TWELVGAIGE_ANTHROPIC_API_KEY: ${{ secrets.TWELVGAIGE_ANTHROPIC_API_KEY }}
          TWELVGAIGE_OPENAI_API_KEY: ${{ secrets.TWELVGAIGE_OPENAI_API_KEY }}
          TWELVGAIGE_GEMINI_API_KEY: ${{ secrets.TWELVGAIGE_GEMINI_API_KEY }}
          TWELVGAIGE_OLLAMA_BASE_URL: ${{ vars.TWELVGAIGE_OLLAMA_BASE_URL }}
          TWELVGAIGE_ANTHROPIC_LIVE_MODEL: ${{ vars.TWELVGAIGE_ANTHROPIC_LIVE_MODEL }}
          TWELVGAIGE_OPENAI_LIVE_MODEL: ${{ vars.TWELVGAIGE_OPENAI_LIVE_MODEL }}
          TWELVGAIGE_GEMINI_LIVE_MODEL: ${{ vars.TWELVGAIGE_GEMINI_LIVE_MODEL }}
          TWELVGAIGE_OLLAMA_LIVE_MODEL: ${{ vars.TWELVGAIGE_OLLAMA_LIVE_MODEL }}
        run: make e2e-provider-live

  sqlcipher:
    name: live sqlcipher
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: live-sqlcipher
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'sqlcipher' || inputs.suite == 'all')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup BEAM
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Cache Mix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-live-sqlcipher-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-live-sqlcipher-mix-

      - name: Live SQLCipher E2E
        env:
          SQLCIPHER_KEY: ${{ secrets.TWELVGAIGE_SQLCIPHER_LIVE_KEY || 'github-live-sqlcipher-test-key' }}
        run: make e2e-sqlcipher-live SQLCIPHER_PREFIX=/usr

  keychain:
    name: live keychain
    runs-on: macos-14
    timeout-minutes: 15
    environment: live-keychain
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'keychain' || inputs.suite == 'all')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup BEAM
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - name: Cache Mix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-live-keychain-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-live-keychain-mix-

      - name: Live macOS Keychain E2E
        run: make keychain-smoke-macos KEYCHAIN_LIVE=1
